ServerName localhost

<Directory /var/www/html>
    Options FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>

# Static assets are safe to cache aggressively. Bunny.net can also
# override/cache these regardless of origin headers via pull-zone rules.
<FilesMatch "\.(?i:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
