app = "indexhibit-db"
primary_region = "ewr"

[build]
  image = "mariadb:11"

[[mounts]]
  source = "mariadb_data"
  destination = "/var/lib/mysql"

[[services]]
  protocol = "tcp"
  internal_port = 3306
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[env]
  MARIADB_DATABASE = "indexhibit"
  MARIADB_USER = "indexhibit"

# Set these with `fly secrets set`:
#   MARIADB_PASSWORD
#   MARIADB_ROOT_PASSWORD
