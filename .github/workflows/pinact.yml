name: Pinact

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    name: Verify actions are pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: suzuki-shunsuke/pinact-action@2a42f29b3397967439ed46e7650f3045f49699f9 # v3.0.1
        with:
          fix: "false"
